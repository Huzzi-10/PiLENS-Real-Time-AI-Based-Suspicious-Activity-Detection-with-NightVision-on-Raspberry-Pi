"143.0" text-anchor="middle" font-size="12" fill="#59636e">2.4 s clip every 0.6 s</text><rect x="668" y="82" width="178" height="90" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="757.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Score head</text><text x="757.0" y="143.0" text-anchor="middle" font-size="12" fill="#59636e">suspicious score 0-1</text><rect x="876" y="82" width="178" height="90" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="965.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">2-of-3 rule</text><text x="965.0" y="143.0" text-anchor="middle" font-size="12" fill="#59636e">2 of last 3 clips high</text><line x1="226" y1="127.0" x2="246" y2="127.0" stroke="#59636e" stroke-width="1.8" marker-end="url(#ah-59636e)"/><line x1="434" y1="127.0" x2="454" y2="127.0" stroke="#59636e" stroke-width="1.8" marker-end="url(#ah-59636e)"/><line x1="642" y1="127.0" x2="662" y2="127.0" stroke="#59636e" stroke-width="1.8" marker-end="url(#ah-59636e)"/><line x1="850" y1="127.0" x2="870" y2="127.0" stroke="#59636e" stroke-width="1.8" marker-end="url(#ah-59636e)"/><rect x="20" y="230" width="1060" height="180" rx="16" fill="#f6f8fa"/><text x="44" y="262" font-size="13" font-weight="700" fill="#14946a" letter-spacing="1">ONLY WHEN AN ALERT IS RAISED  ·  ABOUT 2 s</text><rect x="668" y="292" width="178" height="90" rx="12" fill="#e5f6ef" stroke="#14946a" stroke-width="1.5"/><text x="757.0" y="331.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">CLIP check</text><text x="757.0" y="353.0" text-anchor="middle" font-size="12" fill="#59636e">looks at 4 frames</text><rect x="876" y="292" width="178" height="90" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="965.0" y="331.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Alert</text><text x="965.0" y="353.0" text-anchor="middle" font-size="12" fill="#59636e">snapshot, type hint, buzzer</text><line x1="965.0" y1="176" x2="787.0" y2="286" stroke="#14946a" stroke-width="1.8" marker-end="url(#ah-14946a)"/><text x="937.0" y="236.0" text-anchor="end" font-size="12" fill="#14946a">alert</text><line x1="850" y1="337.0" x2="870" y2="337.0" stroke="#14946a" stroke-width="1.8" marker-end="url(#ah-14946a)"/><text x="861" y="325.0" text-anchor="middle" font-size="11" fill="#14946a">real</text><path d="M668,337.0 H560 V178" fill="none" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-d03b3b)"/><text x="660" y="359.0" text-anchor="end" font-size="12" fill="#d03b3b">false alarm: dropped,</text><text x="660" y="375.0" text-anchor="end" font-size="12" fill="#d03b3b">keep watching</text><text x="44" y="320" font-size="13" fill="#59636e">The small model watches all the time.</text><text x="44" y="342" font-size="13" fill="#59636e">The large model is asked only when something</text><text x="44" y="364" font-size="13" fill="#59636e">looks wrong, and a 10 s cooldown follows each alert.</text></svg>