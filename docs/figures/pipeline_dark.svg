<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah-9198a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="ah-2fbf8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fbf8a"/></marker><marker id="ah-f47067" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f47067"/></marker><marker id="ah-4493f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker></defs><rect width="1100" height="430" fill="#0d1117"/><rect x="20" y="20" width="1060" height="190" rx="16" fill="#151b23"/><text x="44" y="52" font-size="13" font-weight="700" fill="#4493f8" letter-spacing="1">EVERY CLIP  ·  ON THE RASPBERRY PI 5 CPU  ·  ABOUT 0.14 s</text><rect x="44" y="82" width="178" height="90" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="133.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Camera</text><text x="133.0" y="143.0" text-anchor="middle" font-size="12" fill="#9198a1">NoIR, 30 FPS</text><rect x="252" y="82" width="178" height="90" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="341.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Motion gate</text><text x="341.0" y="143.0" text-anchor="middle" font-size="12" fill="#9198a1">skips still scenes</text><rect x="460" y="82" width="178" height="90" rx="12" fill="#0f2440" stroke="#4493f8" stroke-width="1.5"/><text x="549.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">MoViNet-A0</text><text x="549.0" y="143.0" text-anchor="middle" font-size="12" fill="#9198a1">2.4 s clip every 0.6 s</text><rect x="668" y="82" width="178" height="90" rx="12" fill="#0f2440" stroke="#4493f8" stroke-width="1.5"/><text x="757.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Score head</text><text x="757.0" y="143.0" text-anchor="middle" font-size="12" fill="#9198a1">suspicious score 0-1</text><rect x="876" y="82" width="178" height="90" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="965.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">2-of-3 rule</text><text x="965.0" y="143.0" text-anchor="middle" font-size="12" fill="#9198a1">2 of last 3 clips high</text><line x1="226" y1="127.0" x2="246" y2="127.0" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah-9198a1)"/><line x1="434" y1="127.0" x2="454" y2="127.0" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah-9198a1)"/><line x1="642" y1="127.0" x2="662" y2="127.0" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah-9198a1)"/><line x1="850" y1="127.0" x2="870" y2="127.0" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah-9198a1)"/><rect x="20" y="230" width="1060" height="180" rx="16" fill="#151b23"/><text x="44" y="262" font-size="13" font-weight="700" fill="#2fbf8a" letter-spacing="1">ONLY WHEN AN ALERT IS RAISED  ·  ABOUT 2 s</text><rect x="668" y="292" width="178" height="90" rx="12" fill="#0d2b22" stroke="#2fbf8a" stroke-width="1.5"/><text x="757.0" y="331.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">CLIP check</text><text x="757.0" y="353.0" text-anchor="middle" font-size="12" fill="#9198a1">looks at 4 frames</text><rect x="876" y="292" width="178" height="90" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="965.0" y="331.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Alert</text><text x="965.0" y="353.0" text-anchor="middle" font-size="12" fill="#9198a1">snapshot, type hint, buzzer</text><line x1="965.0" y1="176" x2="787.0" y2="286" stroke="#2fbf8a" stroke-width="1.8" marker-end="url(#ah-2fbf8a)"/><text x="937.0" y="236.0" text-anchor="end" font-size="12" fill="#2fbf8a">alert</text><line x1="850" y1="337.0" x2="870" y2="337.0" stroke="#2fbf8a" stroke-width="1.8" marker-end="url(#ah-2fbf8a)"/><text x="861" y="325.0" text-anchor="middle" font-size="11" fill="#2fbf8a">real</text><path d="M668,337.0 H560 V178" fill="none" stroke="#f47067" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-f47067)"/><text x="660" y="359.0" text-anchor="end" font-size="12" fill="#f47067">false alarm: dropped,</text><text x="660" y="375.0" text-anchor="end" font-size="12" fill="#f47067">keep watching</text><text x="44" y="320" font-size="13" fill="#9198a1">The small model watches all the time.</text><text x="44" y="342" font-size="13" fill="#9198a1">The large model is asked only when something</text><text x="44" y="364" font-size="13" fill="#9198a1">looks wrong, and a 10 s cooldown follows each alert.</text></svg>